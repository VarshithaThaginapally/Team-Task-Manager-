<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <!-- LEFT DESIGN -->
    <div class="left">
        <div class="circle"></div>
    </div>

    <!-- RIGHT FORM -->
    <div class="right">

        <h2>Create Account</h2>

        <form method="POST">

            <div class="input-box">
                <input type="text"
                       name="name"
                       placeholder="Full Name"
                       required>
            </div>

            <div class="input-box">
                <input type="email"
                       name="email"
                       placeholder="Email"
                       required>
            </div>

            <div class="input-box">
                <input type="password"
                       name="password"
                       placeholder="Password"
                       required>
            </div>

            <button type="submit">
                SIGN UP
            </button>

        </form>

        <div class="links register">
            <a href="/login">
                Already have account? Login →
            </a>
        </div>

    </div>

</div>

</body>
</html>
