<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <!-- LEFT DESIGN -->
    <div class="left">
        <div class="circle"></div>
    </div>

    <!-- RIGHT FORM -->
    <div class="right">

        <h2>User Login</h2>

        <form method="POST">

            <div class="input-box">
                <input type="email"
                       name="email"
                       placeholder="Username"
                       required>
            </div>

            <div class="input-box">
                <input type="password"
                       name="password"
                       placeholder="Password"
                       required>
            </div>

            <button type="submit">
                LOGIN
            </button>

        </form>

        <div class="links">
            Forgot Username / Password?
        </div>

        <div class="links register">
            <a href="/register">
                Create Your Account →
            </a>
        </div>

    </div>

</div>

</body>
</html>
