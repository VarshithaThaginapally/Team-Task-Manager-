<!DOCTYPE html>
<html>

<head>

<title>Task Dashboard</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:30px;
}

.container{
max-width:900px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.logout-btn{
background:red;
color:white;
padding:10px 18px;
text-decoration:none;
border-radius:8px;
}

.form-box{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:25px;
}

input{
padding:12px;
width:75%;
border:1px solid #ccc;
border-radius:8px;
}

button{
padding:12px 18px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.task{
background:white;
padding:18px;
border-radius:12px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.completed{
color:green;
font-weight:bold;
}

.pending{
color:orange;
font-weight:bold;
}

.actions a{
text-decoration:none;
font-size:20px;
margin-left:15px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h2>
Welcome {{name}}
</h2>

<a href="/logout"
class="logout-btn">
Logout
</a>

</div>

<!-- ADD TASK -->

<div class="form-box">

<form method="POST"
action="/add_task">

<input type="text"
name="title"
placeholder="Enter Task"
required>

<button type="submit">
Add Task
</button>

</form>

</div>

<!-- TASK LIST -->

{% for task in tasks %}

<div class="task">

<div>

<h3>
{{task.title}}
</h3>

{% if task.status == 'Completed' %}

<span class="completed">
Completed
</span>

{% else %}

<span class="pending">
Pending
</span>

{% endif %}

</div>

<div class="actions">

<a href="/complete_task/{{task.id}}">
✅
</a>

<a href="/delete_task/{{task.id}}">
❌
</a>

</div>

</div>

{% endfor %}

</div>

</body>

</html>
